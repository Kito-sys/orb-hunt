<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ציד האורות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen canvas game, HUD pinned top, centered modal cards for start / level / game over */
:root{
  --sky:#0e0c22; --sky2:#1b1640; --ink:#f4efe2; --muted:#a9a3c4;
  --gold:#ffd36e; --aqua:#6ee7f2; --void:#b06cff; --danger:#ff7a8a;
  --card:rgba(24,20,54,.92); --line:rgba(255,255,255,.14);
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none}
#app{position:fixed;inset:0;direction:rtl}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;justify-content:space-between;align-items:center;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;flex-wrap:wrap}
.chip{background:rgba(14,12,34,.6);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;
  font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.chip b{color:var(--gold);font-weight:700}
#hearts{letter-spacing:2px;color:var(--danger)}
.bar{position:absolute;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));height:4px;background:rgba(255,255,255,.08);pointer-events:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--aqua),var(--gold));transition:width .2s}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,6,20,.55);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px;max-width:380px;width:100%;
  text-align:center;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:38px;color:var(--gold)}
h2{font-size:30px}
p{margin:0;color:var(--muted);line-height:1.55;font-size:16px}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:14px;color:var(--ink)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
button{font-family:var(--body);font-size:17px;font-weight:700;border-radius:14px;padding:14px 16px;cursor:pointer;border:1px solid var(--line);
  background:transparent;color:var(--ink);width:100%}
button.primary{background:var(--gold);color:#241a00;border-color:transparent}
button:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
button:disabled{opacity:.6;cursor:wait}
.status{font-size:14px;color:var(--aqua);min-height:20px}
.big{font-family:var(--display);font-size:46px;color:var(--gold);font-variant-numeric:tabular-nums}
.small{font-size:13px}
#pauseBtn{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));
  width:auto;padding:10px 16px;font-size:15px;background:rgba(14,12,34,.6)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <video id="vid" playsinline muted></video>

  <div class="hud" id="hud" hidden>
    <span class="chip">שלב <b id="hLevel">1</b></span>
    <span class="chip"><b id="hScore">0</b> מתוך <span id="hTarget">10</span></span>
    <span class="chip">⏱ <b id="hTime">40</b></span>
    <span class="chip" id="hearts">♥♥♥</span>
  </div>
  <div class="bar" id="bar" hidden><i id="barFill"></i></div>
  <button id="pauseBtn" hidden>השהיה</button>

  <div class="overlay" id="startScreen">
    <div class="card">
      <h1>ציד האורות</h1>
      <p>מרימים יד מול המצלמה ונוגעים עם האצבע המורה בכדורי האור. אוספים מספיק אורות לפני שהזמן נגמר ועולים שלב.</p>
      <div class="legend">
        <span><i class="dot" style="background:var(--aqua)"></i>אור, נקודה</span>
        <span><i class="dot" style="background:var(--gold)"></i>זהב, 3 נקודות</span>
        <span><i class="dot" style="background:#2a1440;border:2px solid var(--void)"></i>צל, לא לגעת</span>
      </div>
      <button class="primary" id="camBtn">שחקו עם המצלמה</button>
      <button id="touchBtn">שחקו עם האצבע על המסך</button>
      <div class="status" id="status" role="status"></div>
      <p class="small" id="bestLine"></p>
    </div>
  </div>

  <div class="overlay" id="levelScreen" hidden>
    <div class="card">
      <h2 id="lvTitle">שלב 1 הושלם</h2>
      <div class="big" id="lvScore">0</div>
      <p id="lvNext"></p>
      <button class="primary" id="nextBtn">לשלב הבא</button>
    </div>
  </div>

  <div class="overlay" id="overScreen" hidden>
    <div class="card">
      <h2 id="ovTitle">נגמר הזמן</h2>
      <p id="ovText"></p>
      <button class="primary" id="retryBtn">לנסות את השלב שוב</button>
      <button id="homeBtn">חזרה להתחלה</button>
    </div>
  </div>

  <div class="overlay" id="pauseScreen" hidden>
    <div class="card">
      <h2>הפסקה</h2>
      <button class="primary" id="resumeBtn">להמשיך</button>
      <button id="quitBtn">חזרה להתחלה</button>
    </div>
  </div>
</div>

<script>
(function(){
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), vid = $('vid');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- levels ----------
const BASE = [
  {target:10, time:40, speed:70,  spawn:1.0,  dark:0,    gold:0.08},
  {target:14, time:40, speed:90,  spawn:0.85, dark:0,    gold:0.10},
  {target:18, time:40, speed:105, spawn:0.75, dark:0.15, gold:0.10},
  {target:22, time:40, speed:120, spawn:0.65, dark:0.22, gold:0.12},
  {target:26, time:40, speed:140, spawn:0.55, dark:0.28, gold:0.12},
];
function levelCfg(n){
  if (n <= BASE.length) return BASE[n-1];
  const k = n - BASE.length;
  return {target:26+k*4, time:40, speed:140+k*15, spawn:Math.max(0.32, 0.55-k*0.04), dark:Math.min(0.42, 0.28+k*0.03), gold:0.12};
}

// ---------- state ----------
const S = {mode:null, running:false, level:1, score:0, lives:3, time:40, cfg:null,
  orbs:[], parts:[], spawnT:0, shake:0, last:0, flash:0};
const pointer = {x:-999, y:-999, active:false, trail:[]};
let best = 1;
try { best = parseInt(localStorage.getItem('orbHuntBest')||'1',10) || 1; } catch(e){}
function showBest(){ $('bestLine').textContent = best > 1 ? ('השלב הגבוה ביותר שהגעתם אליו: ' + best) : ''; }
showBest();

function orbRadius(){ return Math.max(18, Math.min(W,H) * (0.07 - Math.min(S.level,8)*0.003)); }

function spawnOrb(){
  const r = orbRadius();
  const roll = Math.random();
  let type = 'light';
  if (roll < S.cfg.dark) type = 'dark';
  else if (roll < S.cfg.dark + S.cfg.gold) type = 'gold';
  const scale = Math.min(W,H) / 700 + 0.5;
  S.orbs.push({x: r + Math.random()*(W-2*r), y: -r, r: type==='gold' ? r*0.8 : r,
    vy: S.cfg.speed * scale * (0.8 + Math.random()*0.4) * (type==='gold'?1.25:1),
    phase: Math.random()*6.28, sway: 20 + Math.random()*30, type, born: performance.now()});
}

function burst(x,y,color,n){
  if (reduceMotion) n = Math.min(n, 6);
  for (let i=0;i<n;i++){
    const a = Math.random()*6.283, s = 80 + Math.random()*220;
    S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.6+Math.random()*0.4,max:1,color,r:2+Math.random()*3});
  }
}

function updateHud(){
  $('hLevel').textContent = S.level;
  $('hScore').textContent = S.score;
  $('hTarget').textContent = S.cfg.target;
  $('hTime').textContent = Math.ceil(S.time);
  $('hearts').textContent = '♥'.repeat(Math.max(0,S.lives)) + '♡'.repeat(Math.max(0,3-S.lives));
  $('barFill').style.width = Math.min(100, S.score / S.cfg.target * 100) + '%';
}

function setScreen(id){
  ['startScreen','levelScreen','overScreen','pauseScreen'].forEach(s => $(s).hidden = (s !== id));
  const playing = id === null;
  $('hud').hidden = !playing && id !== 'pauseScreen';
  $('bar').hidden = $('hud').hidden;
  $('pauseBtn').hidden = !playing;
}

function startLevel(n){
  S.level = n; S.cfg = levelCfg(n); S.score = 0; S.lives = 3; S.time = S.cfg.time;
  S.orbs = []; S.parts = []; S.spawnT = 0.3; S.running = true; S.last = performance.now();
  updateHud(); setScreen(null);
}

function levelDone(){
  S.running = false;
  if (S.level + 1 > best){ best = S.level + 1; try{ localStorage.setItem('orbHuntBest', String(best)); }catch(e){} }
  $('lvTitle').textContent = 'שלב ' + S.level + ' הושלם';
  $('lvScore').textContent = S.score + ' אורות';
  const nx = levelCfg(S.level+1);
  let txt = 'בשלב ' + (S.level+1) + ' צריך ' + nx.target + ' אורות, והכדורים מהירים יותר.';
  if (S.level+1 === 3) txt += ' מופיעים כדורי צל, לא לגעת בהם.';
  $('lvNext').textContent = txt;
  setScreen('levelScreen');
  $('nextBtn').focus();
}

function gameOver(reason){
  S.running = false;
  $('ovTitle').textContent = reason === 'lives' ? 'נגעתם ביותר מדי צללים' : 'נגמר הזמן';
  $('ovText').textContent = 'אספתם ' + S.score + ' מתוך ' + S.cfg.target + ' בשלב ' + S.level + '.';
  setScreen('overScreen');
  $('retryBtn').focus();
}

// ---------- hand tracking ----------
let landmarker = null, lastVideoTime = -1, handSeenAt = 0;
async function startCamera(){
  const status = $('status');
  if (landmarker && vid.srcObject && vid.readyState >= 2){ S.mode = 'camera'; status.textContent = ''; startLevel(1); return; }
  $('camBtn').disabled = true;
  status.textContent = 'מבקשים גישה למצלמה...';
  try{
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nocam');
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false});
    vid.srcObject = stream; await vid.play();
    status.textContent = 'טוענים את זיהוי היד...';
    const mp = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fileset = await mp.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = {baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:'GPU'}, runningMode:'VIDEO', numHands:1};
    try { landmarker = await mp.HandLandmarker.createFromOptions(fileset, opts); }
    catch(e){ opts.baseOptions.delegate = 'CPU'; landmarker = await mp.HandLandmarker.createFromOptions(fileset, opts); }
    S.mode = 'camera'; status.textContent = '';
    startLevel(1);
  }catch(err){
    try{ if (vid.srcObject) vid.srcObject.getTracks().forEach(t => t.stop()); }catch(e){}
    vid.srcObject = null; landmarker = null;
    $('camBtn').disabled = false;
    status.textContent = 'המצלמה לא זמינה כאן. אפשר לשחק עם האצבע על המסך, או לפתוח את המשחק בדפדפן רגיל.';
    $('camBtn').disabled = false;
  }
}

function videoRect(){
  const vw = vid.videoWidth || 640, vh = vid.videoHeight || 480;
  const s = Math.max(W/vw, H/vh), dw = vw*s, dh = vh*s;
  return {ox:(W-dw)/2, oy:(H-dh)/2, dw, dh};
}

function trackHand(){
  if (!landmarker || vid.readyState < 2) return;
  if (vid.currentTime === lastVideoTime) return;
  lastVideoTime = vid.currentTime;
  const res = landmarker.detectForVideo(vid, performance.now());
  if (res && res.landmarks && res.landmarks.length){
    const tip = res.landmarks[0][8];
    const r = videoRect();
    const x = W - (r.ox + tip.x * r.dw);   // mirrored like a mirror
    const y = r.oy + tip.y * r.dh;
    // light smoothing
    if (pointer.active){ pointer.x += (x - pointer.x)*0.6; pointer.y += (y - pointer.y)*0.6; }
    else { pointer.x = x; pointer.y = y; }
    pointer.active = true; handSeenAt = performance.now();
  } else if (performance.now() - handSeenAt > 250){
    pointer.active = false;
  }
}

// ---------- touch / mouse ----------
function setPtr(e){
  const b = cv.getBoundingClientRect();
  pointer.x = e.clientX - b.left; pointer.y = e.clientY - b.top; pointer.active = true;
}
cv.addEventListener('pointerdown', e => { if (S.mode==='touch') setPtr(e); });
cv.addEventListener('pointermove', e => { if (S.mode==='touch' && (e.pointerType==='mouse' || e.buttons || e.pressure>0)) setPtr(e); });
cv.addEventListener('pointerup', e => { if (S.mode==='touch' && e.pointerType!=='mouse') pointer.active = false; });
cv.addEventListener('pointerleave', () => { if (S.mode==='touch') pointer.active = false; });

// ---------- loop ----------
function step(now){
  requestAnimationFrame(step);
  const dt = Math.min(0.05, (now - S.last)/1000 || 0); S.last = now;
  if (S.mode === 'camera') trackHand();

  if (pointer.active){ pointer.trail.push({x:pointer.x,y:pointer.y,t:now}); }
  pointer.trail = pointer.trail.filter(p => now - p.t < 180);

  if (S.running){
    S.time -= dt;
    S.spawnT -= dt;
    if (S.spawnT <= 0){ spawnOrb(); S.spawnT = S.cfg.spawn * (0.7 + Math.random()*0.6); }
    const pr = Math.max(14, Math.min(W,H)*0.03);
    for (let i=S.orbs.length-1;i>=0;i--){
      const o = S.orbs[i];
      o.y += o.vy*dt; o.phase += dt*1.6;
      const ox = o.x + Math.sin(o.phase)*o.sway*0.02*60*dt;
      o.x = Math.max(o.r, Math.min(W-o.r, ox));
      if (pointer.active){
        const dx = o.x - pointer.x, dy = o.y - pointer.y;
        if (dx*dx + dy*dy < (o.r+pr)*(o.r+pr)){
          if (o.type === 'dark'){
            S.lives--; S.shake = 0.35; S.flash = 0.3; burst(o.x,o.y,'#b06cff',18);
            if (navigator.vibrate) try{ navigator.vibrate(80); }catch(e){}
          } else {
            S.score += o.type==='gold' ? 3 : 1;
            burst(o.x,o.y, o.type==='gold' ? '#ffd36e' : '#6ee7f2', o.type==='gold'?26:14);
          }
          S.orbs.splice(i,1); updateHud();
          continue;
        }
      }
      if (o.y - o.r > H) S.orbs.splice(i,1);
    }
    if (S.score >= S.cfg.target) levelDone();
    else if (S.lives <= 0) gameOver('lives');
    else if (S.time <= 0){ S.time = 0; gameOver('time'); }
    $('hTime').textContent = Math.ceil(Math.max(0,S.time));
  }

  for (let i=S.parts.length-1;i>=0;i--){
    const p = S.parts[i]; p.life -= dt;
    if (p.life <= 0){ S.parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.94; p.vy *= 0.94;
  }
  S.shake = Math.max(0, S.shake - dt); S.flash = Math.max(0, S.flash - dt);
  draw(now);
}

function drawOrb(o, now){
  const g = ctx.createRadialGradient(o.x - o.r*0.3, o.y - o.r*0.3, o.r*0.1, o.x, o.y, o.r*1.6);
  if (o.type === 'dark'){
    g.addColorStop(0,'#4a2470'); g.addColorStop(0.55,'#1c0d2e'); g.addColorStop(1,'rgba(176,108,255,0)');
  } else if (o.type === 'gold'){
    g.addColorStop(0,'#fff6d6'); g.addColorStop(0.4,'#ffd36e'); g.addColorStop(1,'rgba(255,211,110,0)');
  } else {
    g.addColorStop(0,'#eafcff'); g.addColorStop(0.45,'#6ee7f2'); g.addColorStop(1,'rgba(110,231,242,0)');
  }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(o.x, o.y, o.r*1.6, 0, 6.283); ctx.fill();
  if (o.type === 'dark'){
    ctx.strokeStyle = 'rgba(176,108,255,.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r*0.75 + Math.sin(now/200)*2, 0, 6.283); ctx.stroke();
  }
}

const stars = Array.from({length:70}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*1.4+0.3, tw:Math.random()*6}));

function draw(now){
  ctx.save();
  if (S.shake > 0 && !reduceMotion){ ctx.translate((Math.random()-0.5)*12*S.shake, (Math.random()-0.5)*12*S.shake); }
  // background
  if (S.mode === 'camera' && vid.readyState >= 2){
    const r = videoRect();
    ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
    ctx.drawImage(vid, r.ox, r.oy, r.dw, r.dh);
    ctx.restore();
    ctx.fillStyle = 'rgba(14,12,34,.62)'; ctx.fillRect(-20,-20,W+40,H+40);
  } else {
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0e0c22'); bg.addColorStop(1,'#1b1640');
    ctx.fillStyle = bg; ctx.fillRect(-20,-20,W+40,H+40);
    ctx.fillStyle = '#f4efe2';
    for (const s of stars){ ctx.globalAlpha = 0.3 + 0.4*Math.abs(Math.sin(now/900 + s.tw)); ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 6.283); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  for (const o of S.orbs) drawOrb(o, now);
  for (const p of S.parts){ ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
  // pointer trail + cursor
  if (pointer.trail.length > 1){
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,211,110,.45)'; ctx.lineWidth = 8;
    ctx.beginPath(); pointer.trail.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.stroke();
  }
  if (pointer.active){
    const pr = Math.max(14, Math.min(W,H)*0.03);
    ctx.strokeStyle = '#ffd36e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, pr, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(255,211,110,.25)'; ctx.fill();
  } else if (S.running && S.mode === 'camera'){
    ctx.fillStyle = 'rgba(244,239,226,.85)'; ctx.font = '600 18px Assistant, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('הרימו יד מול המצלמה', W/2, H - 70);
  }
  if (S.flash > 0){ ctx.fillStyle = 'rgba(176,108,255,' + (S.flash*0.6) + ')'; ctx.fillRect(-20,-20,W+40,H+40); }
  ctx.restore();
}
requestAnimationFrame(t => { S.last = t; step(t); });

// ---------- buttons ----------
$('camBtn').addEventListener('click', startCamera);
$('touchBtn').addEventListener('click', () => { S.mode = 'touch'; $('status').textContent=''; startLevel(1); });
$('nextBtn').addEventListener('click', () => startLevel(S.level + 1));
$('retryBtn').addEventListener('click', () => startLevel(S.level));
function goHome(){ S.running = false; S.orbs = []; showBest(); setScreen('startScreen'); }
$('homeBtn').addEventListener('click', goHome);
$('quitBtn').addEventListener('click', goHome);
$('pauseBtn').addEventListener('click', () => { if (!S.running) return; S.running = false; setScreen('pauseScreen'); });
$('resumeBtn').addEventListener('click', () => { S.running = true; S.last = performance.now(); setScreen(null); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.running){ S.running = false; setScreen('pauseScreen'); }
});
})();
</script>
